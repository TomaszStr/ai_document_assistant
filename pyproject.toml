[project]
name = "document-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "TomaszStr",email = "tstrycharz@student.agh.edu.pl"}
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "langchain (>=1.3.2,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "pypdf (>=6.12.2,<7.0.0)",
    "docx2txt (>=0.9,<0.10)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-openai (>=1.2.2,<2.0.0)",
    "langgraph (>=1.2.2,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "streamlit (>=1.58.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "document_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
